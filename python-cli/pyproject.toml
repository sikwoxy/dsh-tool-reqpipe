[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reqpipe"
version = "0.1.1"
description = "研发团队需求流水线管理工具：需求 → 方案 → 评审 → 开发"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["cli", "pipeline", "requirement", "流水线", "研发"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
reqpipe = "reqpipe.cli:main"

[project.urls]
Homepage = "https://github.com/sikwoxy/dsh-tool-reqpipe"
Source = "https://github.com/sikwoxy/dsh-tool-reqpipe"
"Bug Tracker" = "https://github.com/sikwoxy/dsh-tool-reqpipe/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["reqpipe"]
